version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: voicecrm_db
    environment:
      POSTGRES_DB: voicecrm
      POSTGRES_USER: voicecrm
      POSTGRES_PASSWORD: voicecrm123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicecrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build: ./backend
    container_name: voicecrm_backend
    environment:
      DATABASE_URL: postgresql://voicecrm:voicecrm123@db:5432/voicecrm
      SECRET_KEY: your-secret-key-change-in-production-please-use-32-chars-minimum
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG: "True"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React (optional, for production)
  # Uncomment when frontend is ready
  # frontend:
  #   build: ./frontend
  #   container_name: voicecrm_frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     REACT_APP_API_URL: http://localhost:8000
  #   depends_on:
  #     - backend

volumes:
  postgres_data:

networks:
  default:
    name: voicecrm_network
